<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domesticity</title>
  <style>
    :root { --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e4e2da; --accent: #2f6f5e; --late: #b3412e; --today: #b07a10; --soon: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --card: #1f1f1d; --ink: #f0efe9; --muted: #9c9b93; --line: #333330; --accent: #6fb8a3; --late: #e27a64; --today: #e0ad4a; --soon: #6fb8a3; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
    nav.top { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
    nav.top .brand { font-weight: 700; margin-right: auto; }
    nav.top a { color: var(--muted); text-decoration: none; padding: 4px 2px; }
    nav.top a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--accent); }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 8px 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 620px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: var(--ink); text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    a.card .count { font-size: 2.4rem; font-weight: 700; line-height: 1; }
    a.card .label { font-weight: 600; margin-top: 4px; }
    a.card.late .count { color: var(--late); }
    a.card.today .count { color: var(--today); }
    a.card.soon .count { color: var(--soon); }
    .preview { list-style: none; padding: 0; margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
    .preview li { padding: 1px 0; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
    .btn, button.btn { display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 12px; text-decoration: none; cursor: pointer; font: inherit; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { color: var(--late); }
    .segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
    .segmented a, .segmented button { border: 0; background: var(--card); color: var(--ink); padding: 8px 12px; cursor: pointer; font: inherit; text-decoration: none; }
    .segmented [aria-pressed="true"], .segmented [aria-current="true"], .segmented [aria-current="page"] { background: var(--accent); color: #fff; }
    section.group { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 12px 0; overflow: hidden; }
    section.group header { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    section.group header h2 { font-size: 1rem; margin: 0; }
    section.group header span { color: var(--muted); font-size: .9rem; }
    ul.items { list-style: none; margin: 0; padding: 0; }
    ul.items li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
    ul.items li:first-child { border-top: 0; }
    .title { font-weight: 600; }
    .meta { color: var(--muted); font-size: .9rem; }
    .due.overdue { color: var(--late); font-weight: 600; }
    .due.today { color: var(--today); font-weight: 600; }
    .actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
    .actions button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: .9rem; }
    .actions button.done { background: var(--accent); border-color: var(--accent); color: #fff; }
    .banner { background: var(--card); border: 1px dashed var(--today); border-radius: 10px; padding: 10px 14px; color: var(--muted); font-size: .92rem; margin: 12px 0; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    form.editor { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
    form.editor label { display: grid; gap: 4px; font-size: .92rem; color: var(--muted); }
    form.editor label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); }
    form.editor input[type="text"], form.editor input[type="number"], form.editor select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .days { display: flex; flex-wrap: wrap; gap: 8px; }
    .days label { display: flex; align-items: center; gap: 4px; color: var(--ink); }
    .error { color: var(--late); font-size: .92rem; }
    .hint { color: var(--muted); font-size: .85rem; }
    button.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
    button.link.danger { color: var(--late); }
    .chips { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chips li { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; display: flex; align-items: center; gap: 6px; }
    .chips button.x { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 0 4px; }
    .things { padding: 12px 14px; }
    .things form { margin: 0; }
    .things input[type="text"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <nav class="top">
    <span class="brand">Domesticity</span>
    <a href="#/" data-page="status">Status</a>
    <a href="#/outstanding/room" data-page="outstanding">Outstanding</a>
    <a href="#/spaces" data-page="spaces">Spaces</a>
    <a href="#/configure" data-page="configure">Configure</a>
  </nav>
  <main id="app"></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
