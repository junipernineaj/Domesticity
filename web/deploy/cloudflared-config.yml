# cloudflared tunnel config. Copy to /etc/cloudflared/config.yml on the server and
# replace the placeholders. See web/deploy/README.md for the steps that create them.
tunnel: REPLACE-WITH-TUNNEL-UUID
credentials-file: /etc/cloudflared/REPLACE-WITH-TUNNEL-UUID.json

ingress:
  # Only this hostname is routed. Protect it with a Cloudflare Access policy
  # before it serves anything real (ADR-0008).
  - hostname: domesticity.junipernine.com
    service: http://127.0.0.1:8095
  # Anything else gets a 404 from Cloudflare's side of the tunnel.
  - service: http_status:404
